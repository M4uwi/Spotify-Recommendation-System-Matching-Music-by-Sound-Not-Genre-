project:
  name: "Spotify Song Recommendation System with Similarity Index"
  version: "1.0.0"

data:
  dataset_url: "https://github.com/M4uwi/Spotify-Recommendation-System-Matching-Music-by-Sound-Not-Genre-/blob/main/Dataset/spotify_songs.csv"
  max_samples: 20000

features:
  acoustic_attributes:
    - danceability
    - energy
    - key
    - loudness
    - mode
    - speechiness
    - acousticness
    - instrumentalness
    - liveness
    - valence
    - tempo

model:
  n_clusters: 8
  pca_components: 2
  random_state: 42
  top_n_recommendations: 20
